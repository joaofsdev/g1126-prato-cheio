<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prato Cheio</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 40rem; }
    h1 { font-size: 1.3rem; }
    fieldset { border: 1px solid #ccc; border-radius: .5rem; margin-bottom: 1rem; }
    label { display: block; margin: .5rem 0 .2rem; font-size: .9rem; }
    input, button { font-size: 1rem; padding: .6rem; width: 100%; box-sizing: border-box; }
    button { margin-top: .8rem; cursor: pointer; }
    li { border: 1px solid #ddd; border-radius: .5rem; padding: .6rem; margin-bottom: .5rem; list-style: none; }
    ul { padding: 0; }
    .erro { color: #b00020; min-height: 1.2rem; margin: .5rem 0 0; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Prato Cheio</h1>

  <fieldset>
    <legend>Publicar doação</legend>
    <label for="tipo">Tipo de alimento</label>
    <input id="tipo" placeholder="Ex.: sopa, pão, frutas">
    <label for="quantidade">Quantidade</label>
    <input id="quantidade" placeholder="Ex.: 10 porções">
    <label for="validade">Validade / retirar até</label>
    <input id="validade" type="date">
    <button id="publicar">Publicar</button>
    <p id="erro-publicar" class="erro" role="alert"></p>
  </fieldset>

  <fieldset>
    <legend>Sou uma ONG</legend>
    <label for="ong">Nome da ONG (usado ao aceitar)</label>
    <input id="ong" placeholder="Ex.: ONG Esperança">
  </fieldset>

  <h2>Doações disponíveis</h2>
  <p id="erro-aceitar" class="erro" role="alert"></p>
  <ul id="lista"></ul>

  <script>
    // Envia a requisição e devolve { ok, corpo }, para a tela poder mostrar o erro da API.
    async function enviar(url, dados) {
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });
        const corpo = await res.json().catch(() => ({}));
        return { ok: res.ok, corpo };
      } catch {
        return { ok: false, corpo: { erro: 'Sem conexão com o servidor. Tente de novo.' } };
      }
    }

    function mostrarErro(id, mensagem) {
      document.getElementById(id).textContent = mensagem ?? '';
    }

    async function carregar() {
      const lista = document.getElementById('lista');
      let doacoes;
      try {
        doacoes = await (await fetch('/api/doacoes')).json();
      } catch {
        lista.innerHTML = '<li>Não foi possível carregar as doações.</li>';
        return;
      }
      lista.innerHTML = doacoes.length
        ? ''
        : '<li>Nenhuma doação disponível.</li>';
      for (const d of doacoes) {
        const li = document.createElement('li');
        li.textContent = `${d.tipo} — ${d.quantidade} (até ${d.validade}) `;
        const botao = document.createElement('button');
        botao.textContent = 'Aceitar';
        botao.onclick = async () => {
          mostrarErro('erro-aceitar', '');
          const ong = document.getElementById('ong').value.trim();
          if (!ong) {
            mostrarErro('erro-aceitar', 'Informe o nome da ONG antes de aceitar.');
            document.getElementById('ong').focus();
            return;
          }
          const { ok, corpo } = await enviar(`/api/doacoes/${d.id}/aceitar`, { ong });
          if (!ok) mostrarErro('erro-aceitar', corpo.erro ?? 'Não foi possível aceitar.');
          carregar();
        };
        li.appendChild(botao);
        lista.appendChild(li);
      }
    }

    document.getElementById('publicar').onclick = async () => {
      mostrarErro('erro-publicar', '');
      const campos = ['tipo', 'quantidade', 'validade'];
      const dados = Object.fromEntries(
        campos.map((c) => [c, document.getElementById(c).value])
      );
      const { ok, corpo } = await enviar('/api/doacoes', dados);
      if (!ok) {
        mostrarErro('erro-publicar', corpo.erro ?? 'Não foi possível publicar.');
        return;
      }
      campos.forEach((c) => { document.getElementById(c).value = ''; });
      carregar();
    };

    carregar();
  </script>
</body>
</html>
